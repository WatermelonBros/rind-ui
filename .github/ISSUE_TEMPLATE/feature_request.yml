name: Feature request
description: A new prop, part, behaviour or improvement to an existing component.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to build, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: How do other libraries (Ark UI, Radix, React Aria, Base UI…) handle it?
