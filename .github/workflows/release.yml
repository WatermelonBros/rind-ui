# Releases with Changesets. On every push to main:
#  - pending changesets → opens (or updates) a "Version Packages" pull request that bumps
#    versions and writes the changelogs;
#  - merging that pull request (no changesets left) → builds and publishes the bumped
#    packages to npm, then tags the release.
# Needs the repository secret NPM_TOKEN (an npm granular access token with read and write
# on the @rind-ui scope). See docs/releasing.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # For npm trusted publishing / provenance once the repository is public.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Version pull request, or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "release: version packages"
          title: "release: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance needs a public repository; turn it on when the repo goes public.
          NPM_CONFIG_PROVENANCE: false
