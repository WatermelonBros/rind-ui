name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Every quirk's repro test exists; stale entries (> 12 months) are reported.
      - run: pnpm quirks:check
      - run: pnpm docs:check
      # Builds every package and Storybook; @rind-ui/core's build fails over the runtime's
      # 2.5 kB min+gz budget (packages/core/scripts/size.mjs).
      - run: pnpm build
      - run: pnpm --filter @rind-ui/core size
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test
        env:
          RIND_BROWSERS: chromium,firefox,webkit
