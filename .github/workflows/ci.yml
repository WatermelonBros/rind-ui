name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Firefox and WebKit run on main and every night (pull requests run Chromium: ci-matrix.mjs)
  schedule:
    - cron: "0 3 * * *"

# A new push to a pull request cancels its run still going: the free plan runs 20 jobs at once, and
# an outdated run held them while the new one queued. Runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the change touches. Pushes to main always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.scope.outputs.components }}
      site: ${{ steps.scope.outputs.site }}
      full: ${{ steps.scope.outputs.full }}
      base: ${{ steps.scope.outputs.base }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "components=true" "site=true" "full=true" | tr ' ' '\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The release pull request only bumps versions and writes changelogs, from changes main
          # has already tested (pnpm release builds before it publishes): its checks pass at once,
          # so its auto-merge lands before the next merge to main rewrites it
          if [ "${{ github.head_ref }}" = "changeset-release/main" ]; then
            echo "components=false" "site=false" "full=false" | tr ' ' '\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # Same rules as `pnpm verify` (scripts/ci-scope.mjs).
          node scripts/ci-scope.mjs "$base" | tee -a "$GITHUB_OUTPUT"
      - id: matrix
        run: node scripts/ci-matrix.mjs ${{ github.event_name != 'pull_request' && 'full' || 'pr' }} >> "$GITHUB_OUTPUT"

  static:
    needs: changes
    if: needs.changes.outputs.components == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Every quirk's repro test exists; stale entries (> 12 months) are reported.
      - run: pnpm quirks:check
      - run: pnpm docs:check
      # Packages and the site (its examples harness), built once and shared with the test slices. @rind-ui/core's
      # build fails over the runtime's 2.5 kB min+gz budget (packages/core/scripts/size.mjs).
      - run: pnpm turbo run build --filter='./packages/*' --filter=@rind-ui/site
      - run: pnpm --filter @rind-ui/core size
      - uses: actions/upload-artifact@v4
        with:
          name: build
          # The theme's generated token files (not committed) ride along: tests read them.
          path: |
            packages/*/dist
            apps/site/out
            packages/theme/tokens.manifest.json
            packages/theme/src/builder/components.generated.ts
          retention-days: 1

  # The test suite split by Vitest project and browser, so the slices run in parallel. On
  # pull requests only the tests that import a changed file run (vitest --changed), unless
  # the change touches config or the test infrastructure. The node slice always runs in full:
  # it takes seconds, and some of its tests read files (CSS, manifests) that --changed can't see.
  test:
    needs: [changes, static]
    if: needs.changes.outputs.components == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # jsdom and Chromium on pull requests, every engine on main (scripts/ci-matrix.mjs). Real
      # browsers stay sharded: a full run in one Chromium has dropped the vitest connection mid-run.
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    name: test (${{ matrix.slice }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build
      - if: matrix.browsers != ''
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: matrix.browsers != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}-${{ matrix.browsers }}
      - if: matrix.browsers != ''
        run: pnpm exec playwright install --with-deps ${BROWSERS//,/ }
        env:
          BROWSERS: ${{ matrix.browsers }}
      # A dropped vitest connection ("Browser connection was closed") reruns the slice once; any
      # other failure fails. The Chromium drop itself is fixed by the forced GC below.
      - run: |
          run() { pnpm exec vitest run ${{ matrix.projects }} $CHANGED --passWithNoTests --reporter=default --reporter=json --outputFile.json=vitest-report.json 2>&1 | tee vitest.log; return ${PIPESTATUS[0]}; }
          if run; then exit 0; fi
          if grep -q "VITEST_BROWSER_CONNECTION_CLOSED\|Browser connection was closed" vitest.log; then
            echo "::warning::browser connection dropped; running the slice once more"
            run
          else
            exit 1
          fi
        env:
          RIND_BROWSERS: ${{ matrix.engine || (matrix.browsers != '' && matrix.browsers) || 'chromium' }}
          RIND_MAX_WORKERS: ${{ startsWith(matrix.slice, 'browser-') && '2' || '' }}
          CHANGED: ${{ needs.changes.outputs.full == 'false' && matrix.slice != 'node' && format('--changed {0}', needs.changes.outputs.base) || '' }}
          # Chromium drop: every test iframe leaves ~400 shared-memory fds in the page's renderer, freed
          # only when GC collects the detached iframe. Near 16k the renderer's network pipes all fail
          # at once (every WebSocket, the orchestrator's included). Vitest can force a GC over CDP
          # after each file, but only when /tmp has less free space than the threshold; the huge
          # threshold makes it run always (peak fds ~16k -> ~150). Undocumented Vitest internals,
          # recheck on upgrade: maybeCollectChromiumGarbage in vitest/dist/chunks/index.*.js
          # (vitest 5.0.4: lines 4765-4827). Chromium and Playwright only; a no-op elsewhere.
          VITEST_CHROMIUM_GC_FORCE: "1"
          VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB: "1000"
      - if: always()
        run: node scripts/flaky-report.mjs vitest-report.json
      # Chromium has crashed mid-run with no output: on failure, show whether the kernel killed it.
      - if: failure() && startsWith(matrix.slice, 'browser-')
        run: sudo dmesg | grep -iE "oom|killed process|segfault" || echo "no OOM/kill in dmesg"

  # The required status check: green when every slice above passed or was not needed.
  check:
    if: always()
    needs: [changes, static, test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ok() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }
          [ "${{ needs.changes.result }}" = "success" ] && ok "${{ needs.static.result }}" && ok "${{ needs.test.result }}"

  # The docs site, built and walked page by page: every example in every skin, axe in both
  # phases, invisible text, phone overflow (apps/site/tests/audit.ts). Skipped (green) when the
  # change cannot affect the site. The pages split over four runners (AUDIT_SHARD): one walk
  # takes ~16 minutes, the build one.
  site-audit-shard:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: site-audit (${{ matrix.shard }}/4)
    # a shard takes about 6 minutes: a page that stalls fails the job instead of holding it for
    # hours (it did twice, with a headless Chrome left open)
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.site == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.site == 'true'
        uses: pnpm/action-setup@v4
      - if: needs.changes.outputs.site == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: needs.changes.outputs.site == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.site == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-site-${{ hashFiles('pnpm-lock.yaml') }}
      - if: needs.changes.outputs.site == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: needs.changes.outputs.site == 'true'
        run: pnpm --filter @rind-ui/site run audit
        # names each page as it starts, so a stall shows where
        env:
          AUDIT_TRACE: "1"
          AUDIT_SHARD: ${{ matrix.shard }}/4

  # The required status check for the site: green when every shard passed or was skipped.
  site-audit:
    if: always()
    needs: site-audit-shard
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.site-audit-shard.result }}" = "success" ]'
