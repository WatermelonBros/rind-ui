name: crash-repro (temporary)

on:
  push:
    branches: [ci/chromium-drop-root-cause]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter='./packages/*'
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            packages/*/dist
            packages/theme/tokens.manifest.json
            packages/theme/src/builder/components.generated.ts
          retention-days: 1

  repro:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          ( while true; do echo "$(date +%T) $(df -B1M --output=avail /tmp | tail -1)MB /tmp-shm=$(ls /tmp | grep -c '^\.org\.chromium') /dev/shm=$(df -B1M --output=used /dev/shm | tail -1)MB mem=$(free -m | awk '/Mem/{print $7}')MB"; sleep 5; done ) > disk.log 2>&1 &
          sudo tcpdump -i lo -nn -tttt -U -w tcp.pcap '(ip6 and ip6[6] == 6 and ip6[53] & 0x05 != 0) or (ip6 and ip6[6] == 6 and ip6[53] & 0x12 == 0x02) or (ip and tcp[tcpflags] & (tcp-fin|tcp-rst|tcp-syn) != 0)' > tcpdump.out 2>&1 &
          node -v; ulimit -n; ulimit -Hn; sysctl vm.max_map_count vm.overcommit_memory kernel.pid_max fs.file-max
          ( while true; do for p in $(pgrep -f chrome-headless-shell); do t=$(tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null | grep -o -- '--type=[a-z-]*' | head -1); n=$(ls /proc/$p/fd 2>/dev/null | wc -l); maps=$(wc -l < /proc/$p/maps 2>/dev/null); echo "$(date +%T.%N | cut -c1-12) pid=$p ${t:-browser} fds=$n maps=$maps"; done; sleep 0.5; done ) > fds.log 2>&1 &
          for i in 1 2 3; do
            rm -f debug-prev.log.gz; [ -f "debug-$((i-1)).log" ] && gzip "debug-$((i-1)).log"
            pnpm exec vitest run --project 'browser (chromium)' --shard=1/2 --reporter=dot > "run-$i.log" 2> "debug-$i.log" || true
            tail -5 "run-$i.log"
            if grep -q "Browser connection was closed\|page crashed" "run-$i.log" "debug-$i.log"; then
              echo "::error::dropped on run $i"
              grep -n "crash\|disconnected\|Received signal\|Fatal\|OOM\|out of memory\|heartbeat\|reload\|optimiz\|navigat\|close" "debug-$i.log" | grep -v "pw:api" | tail -80
              tail -40 disk.log
              tail -60 fds.log
              grep -n "frameNavigated\|frameDetached\|targetCrashed\|detachedFromTarget\|webSocketClosed\|targetDestroyed\|frameStartedNavigating\|Inspector\.\|ERROR:\|WARNING:\|VERBOSE" "debug-$i.log" | grep -v "Runtime.consoleAPICalled" | cut -c1-400 > "events-$i.log" || true
              exit 1
            fi
          done
          tail -20 disk.log
        env:
          CI: "true"
          RIND_BROWSERS: chromium
          RIND_MAX_WORKERS: 2
          DEBUG: "pw:browser*,vitest:browser:*"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.rep }}
          path: |
            *.log
            *.log.gz
            tcp.pcap
          retention-days: 3
